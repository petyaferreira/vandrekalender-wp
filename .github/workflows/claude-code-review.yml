name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Comments posted after this time belong to this run (see the last step).
      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs, security issues, and
            code-quality problems. Get the changes with
            `gh pr diff ${{ github.event.pull_request.number }}`.
            Read CLAUDE.md first (it is a map), then docs/principles/index.md,
            and check the PR against the principles that apply, always
            docs/principles/cleanup.md: flag leftovers of anything the PR
            replaces or removes (dead code, unused packages, old names, stale
            comments or docs), unless the PR description says a later PR
            handles them.
            Check decisions against docs/decisions/ (read index.md): flag a PR
            that chooses one approach over a real alternative someone could
            propose again (a tool, a library, a way of testing, building or
            deploying) without adding a decision record, and name the decision
            to record. Also flag a PR that goes against an existing record
            without updating it.
            Leave inline feedback on specific lines with the create_inline_comment tool.
            Always finish by posting one summary comment with
            `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
            also when you left inline comments or found nothing.
            End the summary with one last line, exactly one of:
            `Verdict: no findings` when nothing needs changing before merge
            (optional nits do not count), or `Verdict: changes requested`.
            ./merge-low-risk.sh reads this line to decide whether an agent may
            merge, so never write `no findings` when you are unsure.

            This runs as a single, one-shot job with no later turn to resume from:
            do not spawn a subagent or any other background/async task and wait
            for it to report back — nothing will ever notify you here, so the
            job will end with the review unposted. Do the entire review
            yourself, synchronously, in this one turn, however large the diff
            is, and post the summary comment before finishing.
          claude_args: '--allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment" --disallowedTools "Agent,Task"'
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

      # The action can skip without reviewing and still pass, for example when
      # this PR changes this workflow file (the action requires it to match
      # main). So do not trust its status: check for the summary comment the
      # prompt above requires, and fail loudly when there is none.
      - name: Fail if no review was posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          STARTED: ${{ steps.start.outputs.at }}
        run: |
          posted=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"claude[bot]\" and .created_at >= \"$STARTED\") | .id" | wc -l)
          if [ "$posted" -gt 0 ]; then
            echo "Review posted."
            exit 0
          fi
          echo "::error::No review was posted by this run, so this PR is NOT reviewed. A green check here would have been wrong."
          if gh pr diff "$PR" --name-only | grep -qx '.github/workflows/claude-code-review.yml'; then
            echo "::error::Cause: this PR changes .github/workflows/claude-code-review.yml, and the review action does not run until that file matches main. Ask Petya to review this PR by hand (docs/contributing/pull-requests.md, Review loop)."
          else
            echo "::error::Read the 'Run Claude Code Review' step log above for the cause."
          fi
          exit 1
