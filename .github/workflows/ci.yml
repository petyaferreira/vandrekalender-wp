name: CI and CD (Nordicway Staging)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and every pull request. Needs no secrets and deploys
  # nowhere: it runs ./validate.sh, the same command used locally (PHPCS,
  # Prettier, unit tests and both builds), so a change that is green locally is
  # green here.
  # Before this existed, nothing verified a pull request until after it was
  # merged and the deploy either worked or did not.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      THEME_NAME: vandrekalender-theme
      PLUGIN_NAME: vandrekalender-events

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # PHP 8.4, the version Nordicway and local Docker run (decision 0011).
      # ubuntu-latest ships 8.3.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      # With dev packages: PHPCS and PHPUnit are two.
      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            wp-content/themes/${{ env.THEME_NAME }}/package-lock.json
            wp-content/plugins/${{ env.PLUGIN_NAME }}/package-lock.json

      # Installs only. validate.sh does not install, so it never changes the
      # dependencies it checks.
      - name: Install npm packages
        run: |
          npm ci
          (cd wp-content/themes/${{ env.THEME_NAME }} && (npm ci || npm install))
          (cd wp-content/plugins/${{ env.PLUGIN_NAME }} && (npm ci || npm install))

      - name: Validate
        run: ./validate.sh

  # This is a live site with hosting configured, so it deploys on every push to
  # main and has no DEPLOY_ENABLED switch.
  #
  # needs: validate — nothing reaches staging unless ./validate.sh passed for
  # that commit. A red Validate skips the deploy, so the failure is visible
  # before the code ships, not after.
  #
  # The guard keeps unmerged pull requests off staging. It is written as "not
  # a pull request" rather than "is a push" so that workflow_dispatch keeps
  # working. Manually redeploying staging on demand is the reason that trigger
  # is in the on: block, and == 'push' would have made a manual run validate
  # and then silently do nothing.
  setup-build-deploy-staging:
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-to-nordicway.yml
    with:
      environment: staging
      ref: ${{ github.ref_name }}
    secrets: inherit
