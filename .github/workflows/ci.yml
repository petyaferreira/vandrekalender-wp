name: CI and CD (Nordicway Staging)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Runs on every push and every pull request. Needs no secrets and deploys
  # nowhere: it runs ./validate.sh, the same command used locally (PHPCS,
  # Prettier and both builds), so a change that is green locally is green here.
  # Before this existed, nothing verified a pull request until after it was
  # merged and the deploy either worked or did not.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      THEME_NAME: vandrekalender-theme
      PLUGIN_NAME: vandrekalender-events

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # With dev packages: PHPCS is one.
      - name: Install Composer packages
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            wp-content/themes/${{ env.THEME_NAME }}/package-lock.json
            wp-content/plugins/${{ env.PLUGIN_NAME }}/package-lock.json

      # Installs only. validate.sh does not install, so it never changes the
      # dependencies it checks.
      - name: Install npm packages
        run: |
          npm ci
          (cd wp-content/themes/${{ env.THEME_NAME }} && (npm ci || npm install))
          (cd wp-content/plugins/${{ env.PLUGIN_NAME }} && (npm ci || npm install))

      - name: Validate
        run: ./validate.sh

  # Unchanged except for the event guard. This is a live site with hosting
  # configured, so it deploys on every push to main and has no DEPLOY_ENABLED
  # switch. The guard exists only because this workflow now also runs on pull
  # requests, and an unmerged pull request must not reach staging.
  #
  # Written as "not a pull request" rather than "is a push" so that
  # workflow_dispatch keeps working. Manually redeploying staging on demand is
  # the reason that trigger is in the on: block, and == 'push' would have made
  # a manual run build and then silently do nothing.
  #
  # It does not wait for the validate job above: the deploy builds again in its
  # own workspace, so code that does not build cannot ship either way, and
  # waiting would only make deploys slower. A PHPCS or Prettier failure on main
  # shows as a red Validate check but does not stop the deploy.
  setup-build-deploy-staging:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-to-nordicway.yml
    with:
      environment: staging
      ref: ${{ github.ref_name }}
    secrets: inherit
