services:
  wordpress:
    depends_on:
      - db
      - mailpit
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - ${WORDPRESS_PORT}:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
      WORDPRESS_DEBUG: "true"
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_DB_PREFIX}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'SCRIPT_DEBUG', true );
        define( 'WP_DEVELOPMENT_MODE', 'all' );
        define( 'WP_GOOGLE_LOGIN_CLIENT_ID', '${GOOGLE_LOGIN_CLIENT_ID}' );
        define( 'WP_GOOGLE_LOGIN_SECRET', '${GOOGLE_LOGIN_SECRET}' );
        define( 'WP_GOOGLE_LOGIN_USER_REGISTRATION', true );
    volumes:
      - "./wp-content/themes:/var/www/html/wp-content/themes"
      - "./wp-content/plugins:/var/www/html/wp-content/plugins"
      - "./wp-content/uploads:/var/www/html/wp-content/uploads"
      - "./wp-content/uploads-webpc:/var/www/html/wp-content/uploads-webpc"
      - "./custom.ini:/usr/local/etc/php/conf.d/custom.ini"
    # The official WordPress image bundles two plugins we don't use — Hello Dolly
    # (hello.php) and Akismet — and its entrypoint copies WordPress core into the
    # bind-mounted plugins folder on every start, restoring any that are missing.
    # That's why deleting them from wp-admin or disk never sticks: the next start
    # copies them right back. Neither is managed by Composer (they ship with core,
    # not wpackagist) and both are gitignored, so this is the only place to remove
    # them for good. The image entrypoint runs first and copies core; it then
    # execs this command, so the rm happens *after* the copy, then Apache starts.
    command: >
      bash -c "rm -f /var/www/html/wp-content/plugins/hello.php;
      rm -rf /var/www/html/wp-content/plugins/akismet;
      exec apache2-foreground"

  # Catches every email the site sends locally — join and cancellation
  # confirmations, password resets, form notifications — and shows them in a
  # web inbox instead of delivering them to real addresses.
  mailpit:
    image: axllent/mailpit:latest
    restart: on-failure
    ports:
      - ${MAILPIT_PORT}:8025

  db:
    image: mariadb:10.6.4-focal
    restart: on-failure
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME}
      MYSQL_USER: ${WORDPRESS_DB_USER}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: ${WORDPRESS_DB_PASSWORD}
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: on-failure
    ports:
      - ${PHPMYADMIN_PORT}:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      UPLOAD_LIMIT: 2G
    depends_on:
      - db

volumes:
  db:
