<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mammutmarch – Arrangør</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #2f5d3a;
    --green-dark: #1f4028;
    --badge: #cfe3c2;
    --cream: #f6f3ea;
    --line: #dfe6cf;
    --ink: #1d1f1b;
    --muted: #555;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: #fff; }
  a { color: var(--green); }
  a:hover { color: var(--green-dark); }

  .organiser { max-width: 1376px; margin: 0 auto; padding: 48px 24px 56px; display: flex; flex-direction: column; gap: 40px; }

  .breadcrumb { font-size: 14px; display: flex; gap: 8px; flex-wrap: wrap; }

  .organiser-hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 56px; align-items: start; }

  .organiser-intro { display: flex; flex-direction: column; gap: 20px; }
  .organiser-intro__top { display: flex; gap: 20px; align-items: center; }
  .organiser-avatar { flex: none; width: 88px; height: 88px; border-radius: 50%; background: var(--cream); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 32px; color: var(--green); }
  .badge { background: var(--badge); color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; }
  .organiser-title { font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 5vw, 64px); line-height: 1; margin: 0; }
  .organiser-desc { font-size: 18px; line-height: 1.6; margin: 0; max-width: 680px; text-wrap: pretty; }
  .btn-outline { align-self: flex-start; border: 1.5px solid var(--ink); border-radius: 999px; padding: 10px 22px; font-size: 15px; color: var(--ink); text-decoration: none; }
  .btn-outline:hover { background: var(--ink); color: #fff; }

  .organiser-stats { background: var(--cream); border: 1px solid var(--line); border-radius: 10px; padding: 8px 28px; margin: 0; }
  .organiser-stats__row { padding: 20px 0; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .organiser-stats__row + .organiser-stats__row { border-top: 1px solid var(--line); }
  .organiser-stats dt { font-size: 15px; }
  .organiser-stats dd { margin: 0; font-family: var(--serif); font-size: 36px; color: var(--green); white-space: nowrap; }

  .section-head { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; }
  .section-head h2 { font-family: var(--serif); font-weight: 400; font-size: 44px; margin: 0; }
  .section-head span { font-size: 14px; color: var(--muted); }

  @media (max-width: 860px) {
    .organiser-hero { grid-template-columns: 1fr; gap: 32px; }
  }
</style>
</head>
<body>
<main class="organiser">
  <nav class="breadcrumb" aria-label="Brødkrumme">
    <a href="#">Kalender</a><span>/</span><a href="#">Arrangører</a><span>/</span><span aria-current="page">Mammutmarch</span>
  </nav>

  <header class="organiser-hero">
    <div class="organiser-intro">
      <div class="organiser-intro__top">
        <div class="organiser-avatar" aria-hidden="true">M</div>
        <span class="badge">Officiel arrangør</span>
      </div>
      <h1 class="organiser-title">Mammutmarch</h1>
      <p class="organiser-desc">Mammutmarch er en lang vandrebegivenhed, hvor du vælger en distance mellem 30 og 100 km og går den sammen med andre.</p>
      <a class="btn-outline" href="#" target="_blank" rel="noopener">Besøg hjemmeside</a>
    </div>

    <dl class="organiser-stats" aria-label="Arrangøren i tal">
      <div class="organiser-stats__row"><dt>Kommende ture</dt><dd>3</dd></div>
      <div class="organiser-stats__row"><dt>Regioner</dt><dd>2</dd></div>
      <div class="organiser-stats__row"><dt>Distancer</dt><dd>30–100 km</dd></div>
    </dl>
  </header>

  <div class="section-head">
    <h2>Kommende ture</h2>
    <span>3 ture</span>
  </div>
  <!-- filters, tabs and tour cards continue here -->
</main>
</body>
</html>
